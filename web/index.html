<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta
            name="viewport"
            content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content"
        />
        <meta name="color-scheme" content="dark" />
        <meta name="theme-color" content="#1b1418" />
        <meta name="mobile-web-app-capable" content="yes" />
        <meta name="apple-mobile-web-app-capable" content="yes" />
        <title>Pi Pocket</title>
        <link rel="manifest" href="/manifest.webmanifest" crossorigin="use-credentials" />
        <link rel="icon" href="/icon.svg" type="image/svg+xml" />
        <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
        <link rel="preload" href="/style.css" as="style" />
        <!-- The app's own CSS and extensions' share one cascade layer (extension-ui.js imports theirs into it). -->
        <style>
            @layer pocket;
            @import url("/style.css") layer(pocket);
        </style>
        <!--
            The last look this browser used (theme.js keeps it), before the first paint: no flash of the other mode.
            With Auto, the system's light or dark decides now, as theme.js would.
        -->
        <script>
            (function () {
                try {
                    var look = JSON.parse(localStorage.getItem("pocket.themeCache") || "null");
                    var root = document.documentElement;
                    var light = matchMedia("(prefers-color-scheme: light)").matches;
                    if (look) {
                        for (var each in look.vars) root.style.setProperty(each, look.vars[each]);
                        for (var key in look.attrs) root.dataset[key] = look.attrs[key];
                    }
                    if (!look || look.auto !== false) root.dataset.mode = light ? "light" : "dark";
                    var mode = root.dataset.mode;
                    document
                        .querySelector('meta[name="color-scheme"]')
                        .setAttribute("content", mode);
                    document
                        .querySelector('meta[name="theme-color"]')
                        .setAttribute("content", mode === "light" ? "#fdf8fa" : "#1b1418");
                } catch (error) {}
            })();
        </script>
        <link rel="preload" href="/fonts/Geist.woff2" as="font" type="font/woff2" crossorigin />
        <link
            rel="preload"
            href="/fonts/JetBrainsMono.woff2"
            as="font"
            type="font/woff2"
            crossorigin
        />
        <script type="importmap">
            {
                "imports": {
                    "preact": "/vendor/preact.mjs",
                    "preact/hooks": "/vendor/preact-hooks.mjs",
                    "htm": "/vendor/htm.mjs",
                    "marked": "/vendor/marked.mjs",
                    "dompurify": "/vendor/purify.mjs"
                }
            }
        </script>
    </head>
    <body>
        <!-- The same boot screen the app shows while it starts (Boot in ui.js), so nothing jumps when the script takes over. -->
        <div id="app">
            <div class="boot" data-part="boot" role="status">
                <div class="boot-mark" data-part="brand-mark" aria-hidden="true">π</div>
                <div class="boot-bar" aria-hidden="true"><span></span></div>
                <div class="boot-caption">starting</div>
            </div>
        </div>
        <script type="module" src="/app.js"></script>
    </body>
</html>
